<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tu canasta - DoloYa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;color:#111;min-height:100vh;padding-bottom:140px}
.header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10}
.btn-back{width:42px;height:42px;background:#F3F4F6;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.header h1{font-size:17px;font-weight:800;flex:1;margin-left:10px}
.btn-vaciar-top{padding:10px 20px;background:#F3F4F6;border-radius:999px;border:none;font-size:13px;font-weight:700;cursor:pointer;color:#111}
.restaurante-box{padding:20px 16px 10px 16px;display:flex;align-items:center;justify-content:space-between}
.restaurante-left{display:flex;align-items:center;gap:12px}
.logo-rest{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;border:1px solid #EEE;overflow:hidden}
.restaurante-left b{font-size:18px;font-weight:900}
.restaurante-right{display:flex;align-items:center;gap:10px}
.badge-count{background:#F3F4F6;padding:6px 16px;border-radius:999px;font-size:14px;font-weight:800}
.btn-toggle{width:32px;height:32px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
.btn-toggle.cerrado{transform:rotate(180deg)}
.productos{padding:10px 16px;display:flex;flex-direction:column;gap:18px;transition:all 0.3s}
.productos.oculto{display:none}
.prod-item{display:flex;gap:12px;align-items:flex-start;position:relative}
.prod-img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#F3F4F6;flex-shrink:0}
.prod-info{flex:1;min-width:0;padding-right:110px}
.prod-nombre{font-size:14px;font-weight:700;line-height:1.2}
.prod-precio{font-size:15px;font-weight:900;margin-top:2px}
.prod-desc{font-size:12px;color:#6B7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%}
.prod-controls{position:absolute;right:0;top:0;display:flex;align-items:center;gap:0;background:white;border:1.5px solid #E5E7EB;border-radius:999px;padding:4px 6px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.ctrl-btn{width:28px;height:28px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:800}
.ctrl-num{font-size:14px;font-weight:800;min-width:20px;text-align:center}
.btn-desc-toggle{position:absolute;right:0;bottom:-2px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #EEE;padding:14px 16px;display:flex;gap:12px;z-index:999}
.btn-vaciar-canasta{flex:1;padding:16px;border-radius:999px;border:1.5px solid #E5E7EB;background:white;font-size:15px;font-weight:800;cursor:pointer}
.btn-siguiente{flex:1;padding:16px;border-radius:999px;border:none;background:#E30613;color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(227,6,19,0.25)}
.vacio{text-align:center;padding:80px 20px;color:#9AA0A6}
.vacio b{color:#111;font-size:18px;display:block;margin-bottom:6px}
</style>
</head>
<body>
<div class="header">
  <button class="btn-back" onclick="window.location.href='inicio.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1>Tu canasta</h1>
  <button class="btn-vaciar-top" onclick="vaciarTodo()">Vaciar</button>
</div>
<div id="contenido"></div>
<div class="footer" id="footer" style="display:none">
  <button class="btn-vaciar-canasta" onclick="vaciarTodo()">Vaciar canasta</button>
  <button class="btn-siguiente" onclick="irSiguiente()">Siguiente</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  storageBucket: "doloya-aliados.firebasestorage.app",
  messagingSenderId: "122314467740",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let carrito = JSON.parse(localStorage.getItem('doloya_carrito_v2')||'[]');
let dataRest = JSON.parse(localStorage.getItem('doloya_carrito_restaurante_data')||'null');
let ipKey = null;
let productosAbiertos = true;
let logoRestaurante = dataRest?.logo || null;
const TIEMPO_EXPIRACION = 3 * 60 * 60 * 1000;

const TARIFA_BASE_KM = 30;
const PRECIO_POR_KM = 4;
const TARIFA_SERVICIO_PORC = 0.03;

async function obtenerIP(){
  try{
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    ipKey = d.ip.replace(/\./g,'_');
  }catch(e){
    ipKey = localStorage.getItem('doloya_device_id');
  }
}

// CORREGIDO: AHORA SI SACA EL LOGO REAL
async function obtenerLogo(){
  if(logoRestaurante){ render(); enriquecerDescripciones(); return; }
  if(dataRest?.cat && dataRest?.id){
    try{
      let data = null;
      let snap1 = await get(ref(db, `doloya_aliados/${dataRest.id}`));
      if(snap1.exists()) data = snap1.val();
      if(!data){
        let snap2 = await get(ref(db, `doloya_aliados/${dataRest.cat}/${dataRest.id}`));
        if(snap2.exists()) data = snap2.val();
      }
      if(data){
        if(data.perfil?.imagenPerfil) logoRestaurante = data.perfil.imagenPerfil;
        else if(data.perfil?.imagenPortada) logoRestaurante = data.perfil.imagenPortada;
        else if(data.info?.logo) logoRestaurante = data.info.logo;
        else if(data.info?.imagenPerfil) logoRestaurante = data.info.imagenPerfil;
        else if(data.logo) logoRestaurante = data.logo;
        else if(data.imagenPerfil) logoRestaurante = data.imagenPerfil;
        
        if(logoRestaurante){
          dataRest.logo = logoRestaurante;
          localStorage.setItem('doloya_carrito_restaurante_data', JSON.stringify(dataRest));
        }
        if(data.direccion) dataRest.direccion = data.direccion;
        if(data.lat) dataRest.lat = data.lat;
        if(data.lng) dataRest.lng = data.lng;
        if(data.ubicacion?.lat) dataRest.lat = data.ubicacion.lat;
        if(data.ubicacion?.lng) dataRest.lng = data.ubicacion.lng;
      }
    }catch(e){}
  }
  render();
  enriquecerDescripciones();
}

// NUEVO: BUSCA DESCRIPCION REAL SI EL CARRITO NO LA TRAE
async function enriquecerDescripciones(){
  if(!dataRest?.id) return;
  let necesitaUpdate = false;
  for(let i=0;i<carrito.length;i++){
    let p = carrito[i];
    if(!p.descripcion || p.descripcion.toLowerCase() === p.nombre.toLowerCase()){
      try{
        let snap = await get(ref(db, `doloya_aliados/${dataRest.id}`));
        let root = snap.val();
        if(!root){
          let snap2 = await get(ref(db, `doloya_aliados/${dataRest.cat}/${dataRest.id}`));
          root = snap2.val();
        }
        if(root){
          let descEncontrada = buscarDescripcionEnData(root, p.nombre);
          if(descEncontrada){
            carrito[i].descripcion = descEncontrada;
            necesitaUpdate = true;
          }
        }
      }catch(e){}
    }
  }
  if(necesitaUpdate){
    localStorage.setItem('doloya_carrito_v2', JSON.stringify(carrito));
    render();
  }
}
function buscarDescripcionEnData(root, nombreBuscar){
  if(!root) return null;
  let nombreLower = nombreBuscar.toLowerCase();
  function recorrer(node){
    if(!node || typeof node !== 'object') return null;
    for(let k in node){
      let v = node[k];
      if(v && typeof v === 'object'){
        if(v.nombre && v.nombre.toLowerCase() === nombreLower && v.descripcion){
          return v.descripcion;
        }
        let res = recorrer(v);
        if(res) return res;
      }
    }
    return null;
  }
  return recorrer(root);
}

function render(){
  const cont = document.getElementById('contenido');
  const foot = document.getElementById('footer');
  if(carrito.length===0){
    cont.innerHTML = `<div class="vacio"><b>Tu canasta está vacía</b>Agrega productos de un restaurante</div>`;
    foot.style.display='none';
    return;
  }
  foot.style.display='flex';
  const totalCant = carrito.reduce((s,i)=>s+i.cantidad,0);
  const nombreRest = dataRest?.nombre || 'Restaurante';
  const inicial = nombreRest.charAt(0).toUpperCase();
  cont.innerHTML = `
    <div class="restaurante-box">
      <div class="restaurante-left">
        ${logoRestaurante ? `<img class="logo-rest" src="${logoRestaurante}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><div class="logo-rest" style="display:none;background:#6B0F2A">${inicial}</div>` : `<div class="logo-rest" style="background:#6B0F2A">${inicial}</div>`}
        <b>${nombreRest}</b>
      </div>
      <div class="restaurante-right">
        <div class="badge-count">${totalCant}</div>
        <button class="btn-toggle ${!productosAbiertos?'cerrado':''}" onclick="toggleProductos()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg></button>
      </div>
    </div>
    <div class="productos ${!productosAbiertos?'oculto':''}" id="listaProds">
      ${carrito.map((p,idx)=>{
        let textoDesc = p.descripcion || '';
        if(textoDesc.toLowerCase() === p.nombre.toLowerCase()) textoDesc = '';
        return `
        <div class="prod-item">
          <img class="prod-img" src="${p.imagen}">
          <div class="prod-info">
            <div class="prod-nombre">${p.nombre}</div>
            <div class="prod-precio">$${(p.precio * p.cantidad).toFixed(2)}</div>
            <div class="prod-desc" id="desc-${idx}">${textoDesc}</div>
          </div>
          <div class="prod-controls">
            ${p.cantidad===1 ? `<button class="ctrl-btn" onclick="eliminarItem(${idx})"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>` : `<button class="ctrl-btn" onclick="cambiarCant(${idx}, -1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M5 12h14"/></svg></button>`}
            <span class="ctrl-num">${p.cantidad}</span>
            <button class="ctrl-btn" onclick="cambiarCant(${idx}, 1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
          </div>
          <button class="btn-desc-toggle" onclick="toggleDesc(${idx})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      `}).join('')}
    </div>
  `;
}
window.toggleProductos = ()=>{ productosAbiertos = !productosAbiertos; render(); }
window.toggleDesc = (idx)=>{
  const el = document.getElementById(`desc-${idx}`);
  if(el.style.whiteSpace==='normal'){ el.style.whiteSpace='nowrap'; el.style.overflow='hidden'; }
  else{ el.style.whiteSpace='normal'; el.style.overflow='visible'; }
}
window.cambiarCant = (idx, delta)=>{ carrito[idx].cantidad += delta; if(carrito[idx].cantidad<=0){ carrito.splice(idx,1); } guardar(); }
window.eliminarItem = (idx)=>{ carrito.splice(idx,1); guardar(); }
window.vaciarTodo = async ()=>{
  if(carrito.length===0) return;
  if(!ipKey) await obtenerIP();
  if(dataRest && ipKey){
    await set(ref(db, `carrito/${dataRest.cat}/${dataRest.id}/${ipKey}`), null);
    await set(ref(db, `doloya_aliados/${dataRest.cat}/${dataRest.id}/carritos/${ipKey}`), null);
  }
  carrito=[];
  localStorage.setItem('doloya_carrito_v2', JSON.stringify([]));
  localStorage.removeItem('doloya_carrito_restaurante');
  localStorage.removeItem('doloya_carrito_restaurante_data');
  localStorage.removeItem('doloya_carrito_timestamp');
  render();
  window.location.href='inicio.html';
}
function obtenerUbicacionCliente(){
  try{
    const ubiRaw = localStorage.getItem('doloya_ubicacion');
    const detFullRaw = localStorage.getItem('doloya_detalles_full');
    let ubi = null, det = null;
    try{ ubi = JSON.parse(ubiRaw); }catch(e){}
    try{ det = JSON.parse(detFullRaw); }catch(e){}
    let lat = ubi?.lat || ubi?.ubicacion?.lat || det?.lat || null;
    let lng = ubi?.lng || ubi?.ubicacion?.lng || det?.lng || null;
    let direccion = det?.direccion || ubi?.direccion || "";
    return { lat, lng, direccion, raw: { ubi, det } };
  }catch(e){ return { lat:null, lng:null, direccion:"" }; }
}
async function obtenerDatosRestaurante(){
  if(dataRest?.cat && dataRest?.id){
    try{
      const snap = await get(ref(db, `doloya_aliados/${dataRest.cat}/${dataRest.id}`));
      const d = snap.val();
      if(d){
        return {
          ...dataRest,
          direccion: d.direccion || dataRest.direccion || "",
          lat: d.lat || d.ubicacion?.lat || dataRest.lat || null,
          lng: d.lng || d.ubicacion?.lng || dataRest.lng || null
        };
      }
    }catch(e){}
  }
  return dataRest;
}
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
async function calcularDistanciaKm(restLat, restLng, cliLat, cliLng){
  if(!restLat || !restLng || !cliLat || !cliLng) return 0.3;
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${restLng},${restLat};${cliLng},${cliLat}?overview=false`;
    const r = await fetch(url);
    const j = await r.json();
    if(j.routes && j.routes[0]) return j.routes[0].distance / 1000;
  }catch(e){}
  return haversine(restLat, restLng, cliLat, cliLng);
}
function calcularCostos(costoProductos, distanciaKm){
  let dist = distanciaKm;
  if(dist < 0.3) dist = 0.3;
  const costoEnvio = TARIFA_BASE_KM + (dist * PRECIO_POR_KM);
  const tarifaServicio = costoProductos * TARIFA_SERVICIO_PORC;
  const totalFinal = costoProductos + costoEnvio + tarifaServicio;
  return {
    distanciaKm: parseFloat(dist.toFixed(2)),
    costoEnvio: parseFloat(costoEnvio.toFixed(2)),
    tarifaServicio: parseFloat(tarifaServicio.toFixed(2)),
    totalFinal: parseFloat(totalFinal.toFixed(2))
  };
}
window.irSiguiente = async ()=>{
  if(carrito.length===0) return;
  if(!ipKey) await obtenerIP();
  const clienteUbi = obtenerUbicacionCliente();
  const restFull = await obtenerDatosRestaurante();
  const costoProductos = carrito.reduce((s,i)=>s+i.precio*i.cantidad,0);
  let distanciaKm = 0.3;
  if(restFull.lat && restFull.lng && clienteUbi.lat && clienteUbi.lng){
    distanciaKm = await calcularDistanciaKm(restFull.lat, restFull.lng, clienteUbi.lat, clienteUbi.lng);
  }
  const costos = calcularCostos(costoProductos, distanciaKm);
  if(dataRest && ipKey){
    const ts = localStorage.getItem('doloya_carrito_timestamp');
    let dataCarrito = {
      restauranteId: restFull.id,
      restauranteCat: restFull.cat,
      restauranteNombre: restFull.nombre,
      restauranteDireccion: restFull.direccion || "",
      restauranteLat: restFull.lat || null,
      restauranteLng: restFull.lng || null,
      clienteDireccion: clienteUbi.direccion || "",
      clienteLat: clienteUbi.lat || null,
      clienteLng: clienteUbi.lng || null,
      clienteUbicacion: clienteUbi.raw || null,
      productos: carrito,
      costoProductos: parseFloat(costoProductos.toFixed(2)),
      distanciaKm: costos.distanciaKm,
      costoEnvio: costos.costoEnvio,
      costoEnvioDetalle: `$${TARIFA_BASE_KM} base + $${PRECIO_POR_KM} x ${costos.distanciaKm}km`,
      tarifaServicio: costos.tarifaServicio,
      tarifaServicioPorcentaje: "3%",
      total: costos.totalFinal,
      cantidadTotal: carrito.reduce((s,i)=>s+i.cantidad,0),
      ip: ipKey,
      fecha: ts ? parseInt(ts) : Date.now()
    };
    if(ts){
      dataCarrito.fechaExpiracion = parseInt(ts) + TIEMPO_EXPIRACION;
      dataCarrito.expiraEn = new Date(dataCarrito.fechaExpiracion).toISOString();
    }
    await set(ref(db, `carrito/${restFull.cat}/${restFull.id}/${ipKey}`), dataCarrito);
    await set(ref(db, `doloya_aliados/${restFull.cat}/${restFull.id}/carritos/${ipKey}`), dataCarrito);
    localStorage.setItem('doloya_carrito_restaurante_data', JSON.stringify(restFull));
    localStorage.setItem('doloya_distancia_km', costos.distanciaKm);
    localStorage.setItem('doloya_costo_envio', costos.costoEnvio);
    localStorage.setItem('doloya_tarifa_servicio', costos.tarifaServicio);
  }
  window.location.href='resumen.html';
}
async function guardar(){
  localStorage.setItem('doloya_carrito_v2', JSON.stringify(carrito));
  if(!ipKey) await obtenerIP();
  if(carrito.length===0){
    if(dataRest && ipKey){
      await set(ref(db, `carrito/${dataRest.cat}/${dataRest.id}/${ipKey}`), null);
      await set(ref(db, `doloya_aliados/${dataRest.cat}/${dataRest.id}/carritos/${ipKey}`), null);
    }
    localStorage.removeItem('doloya_carrito_restaurante');
    localStorage.removeItem('doloya_carrito_restaurante_data');
    localStorage.removeItem('doloya_carrito_timestamp');
  }else{
    if(dataRest && ipKey){
      const ts = localStorage.getItem('doloya_carrito_timestamp');
      const clienteUbi = obtenerUbicacionCliente();
      const restFull = await obtenerDatosRestaurante();
      const costoProductos = carrito.reduce((s,i)=>s+i.precio*i.cantidad,0);
      let distanciaKm = 0.3;
      if(restFull.lat && restFull.lng && clienteUbi.lat && clienteUbi.lng){
        distanciaKm = await calcularDistanciaKm(restFull.lat, restFull.lng, clienteUbi.lat, clienteUbi.lng);
      }
      const costos = calcularCostos(costoProductos, distanciaKm);
      let dataCarrito = {
        restauranteId: restFull.id,
        restauranteCat: restFull.cat,
        restauranteNombre: restFull.nombre,
        restauranteDireccion: restFull.direccion || "",
        restauranteLat: restFull.lat || null,
        restauranteLng: restFull.lng || null,
        clienteDireccion: clienteUbi.direccion || "",
        clienteLat: clienteUbi.lat || null,
        clienteLng: clienteUbi.lng || null,
        productos: carrito,
        costoProductos: parseFloat(costoProductos.toFixed(2)),
        distanciaKm: costos.distanciaKm,
        costoEnvio: costos.costoEnvio,
        costoEnvioDetalle: `$${TARIFA_BASE_KM} base + $${PRECIO_POR_KM} x ${costos.distanciaKm}km`,
        tarifaServicio: costos.tarifaServicio,
        tarifaServicioPorcentaje: "3%",
        total: costos.totalFinal,
        cantidadTotal: carrito.reduce((s,i)=>s+i.cantidad,0),
        ip: ipKey,
        fecha: ts ? parseInt(ts) : Date.now()
      };
      if(ts){
        dataCarrito.fechaExpiracion = parseInt(ts) + TIEMPO_EXPIRACION;
        dataCarrito.expiraEn = new Date(dataCarrito.fechaExpiracion).toISOString();
      }
      await set(ref(db, `carrito/${restFull.cat}/${restFull.id}/${ipKey}`), dataCarrito);
      await set(ref(db, `doloya_aliados/${restFull.cat}/${restFull.id}/carritos/${ipKey}`), dataCarrito);
    }
  }
  render();
}
obtenerIP().then(()=>{ obtenerLogo(); });
</script>
</body>
</html>
