<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#C8102E;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 18px;color:white}
.container{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font-size:26px;font-weight:800;line-height:1.1;margin-top:18px;letter-spacing:-0.3px}
p{font-size:15px;font-weight:400;margin-top:8px;line-height:1.3;opacity:0.96;max-width:280px}
.icon-map{width:150px;height:150px;margin:20px 0 28px 0}
.btn{width:100%;height:52px;border-radius:999px;font-size:16px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s}
.btn:active{transform:scale(0.97)}
.btn-white{background:white;color:#151515;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
.btn-outline{background:transparent;border:2px solid white;color:white;margin-top:12px;height:50px}
.status{margin-top:14px;font-size:13px;min-height:18px;font-weight:600;opacity:0.95;text-align:center}
.logo-wrap{width:190px;display:flex;flex-direction:column;align-items:center;background:transparent}
.logo-wrap img{width:180px;height:auto;background:transparent;display:block}
.spinner{width:18px;height:18px;border:2.5px solid #ddd;border-top-color:#D5000F;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.block-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.block-overlay.open{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.block-card{background:white;border-radius:22px;padding:26px 22px 20px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.35);animation:pop .3s}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.block-icon{width:64px;height:64px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.block-card h2{color:#D5000F;font-size:20px;font-weight:900;margin-bottom:10px;letter-spacing:-0.3px}
.block-card p{color:#475569;font-size:13px;line-height:1.4;max-width:100%;margin:0 auto;opacity:1}
.btn-whatsapp{width:100%;background:#25D366;color:white;border:none;border-radius:999px;padding:14px 18px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:18px;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="logo-wrap">
<img src="LOGO-PANEL.PNG" alt="DoloYa">
</div>
<h1>Permite tu ubicación</h1>
<p>Para poder mostrarte los restaurantes<br>y comercios más cercanos a ti.</p>
<svg class="icon-map" viewBox="0 0 200 165" fill="none"><path d="M15 125 L60 105 L60 132 L15 150 Z" fill="white"/><path d="M64 103 L113 90 L118 132 L62 135 Z" fill="white"/><path d="M118 88 L180 80 L188 120 L120 130 Z" fill="white"/><ellipse cx="105" cy="115" rx="32" ry="19" fill="#B0000C"/><path d="M105 8 C66 8 42 33 42 60 C42 98 105 155 105 155 C105 155 168 98 168 60 C168 33 144 8 105 8 Z" fill="white"/><circle cx="105" cy="62" r="22" fill="#D5000F"/><path d="M60 108 Q85 112 110 108" stroke="#FF9CA5" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/><path d="M135 88 L148 122" stroke="#FF9CA5" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/></svg>
<button id="btnPermitir" class="btn btn-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="#D5000F"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span id="txtPermitir">Permitir ubicacion</span></button>
<button id="btnCancelar" class="btn btn-outline">Cancelar</button>
<div id="status" class="status"></div>
</div>

<div id="blockOverlay" class="block-overlay">
  <div class="block-card">
    <div class="block-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E30613" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h2>Dispositivo bloqueado</h2>
    <p>Ha sido bloqueado por seguridad no puedes ingresar a DoloYa<br><br>Contacta soporte si crees que es un error</p>
    <a href="https://wa.me/524182371993?text=Hola%20DoloYa%20mi%20dispositivo%20aparece%20bloqueado" target="_blank" class="btn-whatsapp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.54 2 2.07 6.47 2.07 11.97c0 1.76.46 3.48 1.33 5L2 22l5.18-1.36a9.93 9.93 0 0 0 4.86 1.24h.01c5.5 0 9.97-4.47 9.97-9.97a9.76 9.76 0 0 0-2.97-6.99zM12.05 19.86a7.92 7.92 0 0 1-4.04-1.11l-.29-.17-3.07.8.82-2.99-.19-.31A7.9 7.9 0 0 1 4.06 11.97a7.9 7.9 0 0 1 7.9-7.9 7.84 7.84 0 0 1 5.59 2.32 7.82 7.82 0 0 1 2.31 5.59 7.9 7.9 0 0 1-7.81 7.88zm4.33-5.91c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.39-.41-.54-.42l-.46-.01c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.09.16 1.5.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
      Enviar a WhatsApp
    </a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNL6ebow0VEJ4VfhI2ItVi4gFAjkOiMuo",
  authDomain: "doloya-ubicaciones.firebaseapp.com",
  databaseURL: "https://doloya-ubicaciones-default-rtdb.firebaseio.com",
  projectId: "doloya-ubicaciones",
  storageBucket: "doloya-ubicaciones.firebasestorage.app",
  messagingSenderId: "864757091561",
  appId: "1:864757091561:web:7d4f696b95fdc700dab478",
  measurementId: "G-R2FCMP783L"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
try{ getAnalytics(app); }catch(e){}

const configHistorial = {
  apiKey: "AIzaSyCRx4B7mO444s0yU-WTnsqMjBHDWX4IRv8",
  authDomain: "doloya-historial.firebaseapp.com",
  projectId: "doloya-historial",
  storageBucket: "doloya-historial.firebasestorage.app",
  messagingSenderId: "41258055121",
  appId: "1:41258055121:web:19a443786320e04ebd9cf0"
};
const appHistorial = initializeApp(configHistorial, "historialApp");
const dbHistorial = getFirestore(appHistorial);

function mostrarBloqueado(){
  document.getElementById('blockOverlay').classList.add('open');
}

async function esIpBloqueada(ip){
  if(!ip || ip==="0.0.0.0" || ip==="-") return false;
  try{
    const snap1 = await getDoc(doc(dbHistorial, "ips_bloqueadas", ip));
    if(snap1.exists() && snap1.data().bloqueado===true) return true;
    const snap2 = await getDoc(doc(dbHistorial, "bloqueos_ip", ip));
    if(snap2.exists() && snap2.data().bloqueado===true) return true;
  }catch(e){}
  return false;
}

let unsub1=null, unsub2=null;
function escucharBloqueoTiempoReal(ip){
  if(!ip || ip==="0.0.0.0") return;
  if(unsub1) unsub1();
  if(unsub2) unsub2();
  try{
    unsub1 = onSnapshot(doc(dbHistorial, "ips_bloqueadas", ip), (snap)=>{
      if(snap.exists() && snap.data().bloqueado===true){
        mostrarBloqueado();
      }
    });
    unsub2 = onSnapshot(doc(dbHistorial, "bloqueos_ip", ip), (snap)=>{
      if(snap.exists() && snap.data().bloqueado===true){
        mostrarBloqueado();
      }
    });
  }catch(e){}
}

const btnPermitir = document.getElementById('btnPermitir');
const txtPermitir = document.getElementById('txtPermitir');
const btnCancelar = document.getElementById('btnCancelar');
const statusEl = document.getElementById('status');

btnCancelar.addEventListener('click', () => { window.location.href = "https://www.google.com"; });

(async ()=>{
  try{
    let ipActual = null;
    const saved = localStorage.getItem('doloya_ubicacion');
    if(saved){
      const parsed = JSON.parse(saved);
      ipActual = parsed.ip;
    } else {
      try{
        const r = await fetch('https://api.ipify.org?format=json');
        const j = await r.json();
        ipActual = j.ip;
      }catch{}
    }
    if(ipActual){
      if(await esIpBloqueada(ipActual)){
        mostrarBloqueado();
      }
      escucharBloqueoTiempoReal(ipActual);
      setInterval(async ()=>{
        try{
          const r = await fetch('https://api.ipify.org?format=json');
          const j = await r.json();
          if(j.ip!==ipActual){
            ipActual=j.ip;
            escucharBloqueoTiempoReal(ipActual);
          }
          if(await esIpBloqueada(j.ip)) mostrarBloqueado();
        }catch{}
      }, 5000);
    }
  }catch{}
})();

btnPermitir.addEventListener('click', async () => {
  statusEl.textContent = "Solicitando permiso de ubicacion...";
  btnPermitir.disabled = true;
  txtPermitir.textContent = "Obteniendo ubicacion precisa...";
  const prevIcon = btnPermitir.querySelector('svg');
  if(prevIcon) prevIcon.style.display='none';
  if(!document.getElementById('sp')) btnPermitir.insertAdjacentHTML('afterbegin','<div class="spinner" id="sp"></div>');

  if(!navigator.geolocation){
    statusEl.textContent = "Tu navegador no soporta ubicacion";
    btnPermitir.disabled = false; txtPermitir.textContent = "Permitir ubicacion";
    document.getElementById('sp')?.remove(); if(prevIcon) prevIcon.style.display='block';
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    try{
      statusEl.textContent = "Verificando ubicacion exacta...";
      const lat = parseFloat(pos.coords.latitude);
      const lng = parseFloat(pos.coords.longitude);
      const accuracy = pos.coords.accuracy;

      let ipData = { ip: "0.0.0.0", city: "", country_name: "", region: "", org: "", postal: "" };
      try{
        const r = await fetch('https://ipapi.co/json/');
        ipData = await r.json();
      }catch(e){
        try{ const r2 = await fetch('https://api.ipify.org?format=json'); const j2 = await r2.json(); ipData.ip = j2.ip; }catch{}
      }

      if(await esIpBloqueada(ipData.ip)){
        document.getElementById('sp')?.remove();
        mostrarBloqueado();
        escucharBloqueoTiempoReal(ipData.ip);
        return;
      }

      escucharBloqueoTiempoReal(ipData.ip);
      statusEl.textContent = "Guardando ubicacion exacta...";

      const deviceInfo = {
        userAgent: navigator.userAgent,
        plataforma: navigator.platform,
        idioma: navigator.language,
        zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
        pantalla: window.screen.width + "x" + window.screen.height,
        esMovil: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent),
        conexion: navigator.connection ? navigator.connection.effectiveType : 'unknown'
      };

      let clienteId = localStorage.getItem('doloya_clienteId');
      if(!clienteId){
        clienteId = 'cli_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
        localStorage.setItem('doloya_clienteId', clienteId);
      }

      let contador = parseInt(localStorage.getItem('doloya_contador') || '0') + 1;
      localStorage.setItem('doloya_contador', contador.toString());

      const data = {
        clienteId,
        ubicacion: { lat, lng, accuracy, googleMapsUrl: `https://www.google.com/maps?q=${lat},${lng}` },
        ip: ipData.ip,
        ipInfo: { ciudad: ipData.city || '', region: ipData.region || '', pais: ipData.country_name || ipData.country || '', org: ipData.org || '', postal: ipData.postal || '', city: ipData.city || '' },
        dispositivo: deviceInfo,
        contadorVisitas: contador,
        fechaISO: new Date().toISOString()
      };

      localStorage.setItem('doloya_ubicacion', JSON.stringify(data));
      sessionStorage.setItem('doloya_ubicacion', JSON.stringify(data));
      sessionStorage.setItem('doloya_paso_por_index','true');

      await set(ref(db, 'doloya_clientes/' + clienteId), data);
      await push(ref(db, 'doloya_accesos'), {
        clienteId, lat, lng, accuracy, ip: data.ip, ipInfo: data.ipInfo,
        dispositivo: deviceInfo, contador: contador, fechaISO: data.fechaISO,
        googleMapsUrl: data.ubicacion.googleMapsUrl
      });

      statusEl.textContent = "Ubicacion exacta registrada. Entrando...";
      document.getElementById('sp')?.remove();
      txtPermitir.textContent = "Ubicacion registrada";

      setTimeout(()=>{ window.location.href = "inicio.html"; }, 700);

    }catch(err){
      statusEl.textContent = "Error: " + err.message;
      btnPermitir.disabled = false;
      txtPermitir.textContent = "Permitir ubicacion";
      document.getElementById('sp')?.remove();
      if(prevIcon) prevIcon.style.display='block';
    }
  }, (err)=>{
    btnPermitir.disabled = false;
    txtPermitir.textContent = "Permitir ubicacion";
    document.getElementById('sp')?.remove();
    const prevIcon2 = btnPermitir.querySelector('svg');
    if(prevIcon2) prevIcon2.style.display='block';
    if(err.code === 1){ statusEl.textContent = "Debes permitir la ubicacion para entrar a DoloYa - Activa el GPS"; }
    else{ statusEl.textContent = "Activa el GPS y vuelve a intentar: " + err.message; }
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
});
</script>
</body>
</html>
