<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Editar dirección</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;color:#111;min-height:100vh;padding-bottom:100px}
.header{padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:20;border-bottom:1px solid #F5F5F5}
.btn-back{width:40px;height:40px;background:#F3F4F6;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.header h1{font-size:17px;font-weight:800}
.container{padding:16px}
.sub-direccion{font-size:13px;color:#555;font-weight:600;padding-bottom:16px;border-bottom:1px solid #F0F0F0;margin-bottom:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label{font-size:13px;font-weight:700;margin-bottom:6px;display:block;margin-top:18px}
.input-wrap{position:relative;width:100%}
.input-wrap input, .input-wrap select, .input-wrap textarea{width:100%;padding:16px 44px 16px 16px;border:1.5px solid #E5E7EB;border-radius:16px;font-size:15px;font-weight:600;background:#fff;outline:none;appearance:none}
.input-wrap input:focus, .input-wrap textarea:focus, .input-wrap select:focus{border-color:#111}
.input-wrap textarea{resize:none;height:90px;padding-top:14px}
.btn-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;background:#EEF0F2;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-clear.top{top:18px;transform:none}

/* LISTADO GOOGLE DEBAJO SIN TAPAR */
.sugerencias-box{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.15);border:1.5px solid #E5E7EB;z-index:50;max-height:260px;overflow-y:auto;display:none}
.sugerencias-box.show{display:block}
.sug-item{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;border-bottom:1px solid #F5F5F5}
.sug-item:last-child{border:none}
.sug-item:hover{background:#F9FAFB}
.sug-icon{width:30px;height:30px;background:#F3F4F6;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.sug-text b{font-size:13px;font-weight:800;display:block;line-height:1.2}
.sug-text span{font-size:11.5px;color:#777;display:block;margin-top:2px;line-height:1.3}

.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:16px;border-top:1px solid #F0F0F0;z-index:30}
.btn-guardar{width:100%;padding:16px;background:#E30613;color:#fff;border:none;border-radius:999px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(227,6,19,0.25)}
</style>
</head>
<body>

<div class="header">
  <button class="btn-back" onclick="window.location.href='resumen.html'">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1>Editar dirección</h1>
</div>

<div class="container">
  <div class="sub-direccion" id="subDir">Dolores Hidalgo México</div>

  <label class="label">Dirección</label>
  <div class="input-wrap" id="wrapDireccion">
    <input type="text" id="inputDireccion" placeholder="Ej: Calle Allende #45, Colonia Centro" autocomplete="off" oninput="buscarDireccion(this.value)">
    <button class="btn-clear" onclick="clearInput('inputDireccion')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <!-- LISTA DEBAJO, NO TAPA EL INPUT -->
    <div class="sugerencias-box" id="sugerenciasBox"></div>
  </div>

  <label class="label">Tipo de dirección</label>
  <div class="input-wrap">
    <select id="tipoDireccion">
      <option value="Casa">Casa</option>
      <option value="Oficina">Oficina</option>
      <option value="Departamento">Departamento</option>
      <option value="Otro">Otro</option>
    </select>
    <button class="btn-clear" style="pointer-events:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <label class="label">Nombre del edificio / Referencia</label>
  <div class="input-wrap">
    <input type="text" id="nombreEdificio" placeholder="Ej: Casa blanca, portón negro">
    <button class="btn-clear" onclick="clearInput('nombreEdificio')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <label class="label">No. de oficina / Piso</label>
  <div class="input-wrap">
    <input type="text" id="piso" placeholder="Ej: Primer Piso, Segundo Piso, Piso 1, Piso 2">
    <button class="btn-clear" onclick="clearInput('piso')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <label class="label">Número de celular</label>
  <div class="input-wrap">
    <input type="tel" id="celular" placeholder="Ej: 418 123 4567" maxlength="15">
    <button class="btn-clear" onclick="clearInput('celular')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <label class="label" style="margin-top:22px">Instrucciones para tu DoloYa</label>
  <div class="input-wrap">
    <textarea id="instrucciones" placeholder="Ej: casa con portón rojo, tocar timbre"></textarea>
    <button class="btn-clear top" onclick="clearInput('instrucciones')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

</div>

<div class="footer">
  <button class="btn-guardar" onclick="guardarDetalles()">Guardar</button>
</div>

<script>
const ubicacion = JSON.parse(localStorage.getItem('doloya_ubicacion')||'null');
const detallesGuardados = JSON.parse(localStorage.getItem('doloya_detalles_full')||'null');
let latSeleccionado = ubicacion?.lat || ubicacion?.ubicacion?.lat || 21.1576;
let lngSeleccionado = ubicacion?.lng || ubicacion?.ubicacion?.lng || -100.9306;
let timeoutBusqueda = null;

function clearInput(id){
  document.getElementById(id).value='';
  document.getElementById(id).focus();
  if(id==='inputDireccion'){ ocultarSugerencias(); }
}

// Cargar datos existentes
if(ubicacion?.direccion){
  document.getElementById('inputDireccion').value = ubicacion.direccion;
  document.getElementById('subDir').textContent = ubicacion.direccion;
}
if(detallesGuardados){
  document.getElementById('nombreEdificio').value = detallesGuardados.nombreEdificio || '';
  document.getElementById('piso').value = detallesGuardados.piso || '';
  document.getElementById('celular').value = detallesGuardados.celular || '';
  document.getElementById('instrucciones').value = detallesGuardados.instrucciones || '';
  if(detallesGuardados.tipoDireccion){
    document.getElementById('tipoDireccion').value = detallesGuardados.tipoDireccion;
  }
} else {
  document.getElementById('tipoDireccion').value = 'Oficina';
}

// --- AUTOCOMPLETADO TIPO GOOGLE ---
function buscarDireccion(texto){
  if(timeoutBusqueda) clearTimeout(timeoutBusqueda);
  if(!texto || texto.length < 3){ ocultarSugerencias(); return; }
  timeoutBusqueda = setTimeout(()=>{
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(texto)}&countrycodes=mx&limit=5&addressdetails=1&viewbox=-101.2,21.3,-100.6,20.9&bounded=0`)
    .then(r=>r.json()).then(data=>{
      mostrarSugerencias(data);
    }).catch(()=> ocultarSugerencias());
  }, 400);
}

function mostrarSugerencias(lista){
  const box = document.getElementById('sugerenciasBox');
  if(!lista || lista.length===0){ ocultarSugerencias(); return; }
  box.innerHTML = '';
  lista.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'sug-item';
    div.innerHTML = `
      <div class="sug-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
      <div class="sug-text"><b>${item.address?.road || item.name || 'Dirección'}</b><span>${item.display_name}</span></div>
    `;
    div.onclick = ()=> seleccionarDireccion(item);
    box.appendChild(div);
  });
  box.classList.add('show');
}

function seleccionarDireccion(item){
  document.getElementById('inputDireccion').value = item.display_name;
  latSeleccionado = parseFloat(item.lat);
  lngSeleccionado = parseFloat(item.lon);
  document.getElementById('subDir').textContent = item.display_name;
  ocultarSugerencias();
}

function ocultarSugerencias(){
  document.getElementById('sugerenciasBox').classList.remove('show');
}

// cerrar al tocar fuera
document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('wrapDireccion');
  if(!wrap.contains(e.target)){
    ocultarSugerencias();
  }
});

function guardarDetalles(){
  const direccion = document.getElementById('inputDireccion').value.trim();
  const nombreEdificio = document.getElementById('nombreEdificio').value.trim();
  const piso = document.getElementById('piso').value.trim();
  const celular = document.getElementById('celular').value.trim();
  const instrucciones = document.getElementById('instrucciones').value.trim();
  const tipoDireccion = document.getElementById('tipoDireccion').value;

  if(!direccion){
    alert('Por favor escribe tu dirección');
    return;
  }

  const dataUbi = ubicacion || {};
  dataUbi.direccion = direccion;
  dataUbi.lat = latSeleccionado;
  dataUbi.lng = lngSeleccionado;
  // compatibilidad con tu estructura vieja
  dataUbi.ubicacion = {lat: latSeleccionado, lng: lngSeleccionado};
  localStorage.setItem('doloya_ubicacion', JSON.stringify(dataUbi));

  const full = {direccion, nombreEdificio, piso, celular, instrucciones, tipoDireccion, lat: latSeleccionado, lng: lngSeleccionado};
  localStorage.setItem('doloya_detalles_full', JSON.stringify(full));
  
  let refTexto = `${tipoDireccion ? tipoDireccion+', ' : ''}${nombreEdificio ? nombreEdificio+', ' : ''}${piso ? piso+', ' : ''}${instrucciones ? instrucciones : ''}`.replace(/, $/,'');
  localStorage.setItem('doloya_detalles_referencia', refTexto || 'Sin referencia');
  if(celular) localStorage.setItem('doloya_celular', celular);

  window.location.href = 'resumen.html';
}
</script>
</body>
</html>
