<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pedido Confirmado</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:Helvetica,Arial,sans-serif;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:20px 20px 40px}
.check-wrap{display:flex;justify-content:center;margin-top:30px}
.check-circle{width:96px;height:96px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
h1{text-align:center;font-size:28px;font-weight:800;margin:18px 0 22px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:18px 20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f5f5f5;align-items:center}.row:last-child{border:0}
.label{color:#666;font-size:14px}.value{font-weight:700;font-size:15px}.value.total{color:#16a34a;font-size:18px}
.value.verde{color:#16a34a;font-weight:800}
.timeline-title{margin:26px 0 12px;text-align:center;color:#666;font-size:13px;font-weight:600;letter-spacing:0.3px}
.step{display:flex;gap:12px;padding-bottom:22px;position:relative}.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #e5e7eb;background:#fff;z-index:1}
.icon.active{background:#16a34a;border-color:#16a34a;color:#fff}.icon.current{background:#f59e0b;border-color:#f59e0b;color:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.line{position:absolute;left:20px;top:40px;bottom:-4px;width:2px;background:#e5e7eb}.line.active{background:#16a34a}
.step-text b{font-size:13.5px;font-weight:700;display:block}
.step-text span{font-size:11.5px;color:#666}
.btn-llamar{width:100%;margin-top:22px;background:#E30613;color:#fff;border:none;border-radius:999px;padding:16px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px rgba(227,6,19,0.3)}
</style>
</head>
<body>
<div class="container">
<div class="check-wrap"><div class="check-circle"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div></div>
<h1>Pedido Confirmado</h1>
<div class="card">
<div class="row"><span class="label">Código del pedido</span><span class="value" id="txtCodigo">ST-0</span></div>
<div class="row"><span class="label">Nombre del cliente</span><span class="value" id="txtNombre">...</span></div>
<div class="row"><span class="label">Método de pago</span><span class="value verde" id="txtMetodo">Efectivo</span></div>
<div class="row"><span class="label">Total a pagar</span><span class="value total" id="txtTotal">$ 0 COP MXN</span></div>
</div>
<div class="timeline-title">Estado del pedido</div>
<div id="timeline"></div>

<button class="btn-llamar" id="btnLlamar" onclick="llamarRestaurante()">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
Llamar al restaurante
</button>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, getDoc, setDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const appConf = initializeApp(configConfirmacion, "confirmacion2");
const dbConf = getFirestore(appConf);
const pedidoFinal = JSON.parse(localStorage.getItem('doloya_pedido_final')||'null');
const pedidoId = localStorage.getItem('doloya_pedido_confirmacion_id');

async function obtenerCodigoSecuencial(){
  try{
    const contadorRef = doc(dbConf, "contadores", "pedidos");
    let nuevoCodigo = "";
    await runTransaction(dbConf, async (transaction)=>{
      const snap = await transaction.get(contadorRef);
      let numero = 0;
      if(!snap.exists()){
        numero = 0;
        transaction.set(contadorRef, { total: 1, ultimo: 0 });
      }else{
        numero = snap.data().total || 0;
        transaction.update(contadorRef, { total: numero + 1, ultimo: numero });
      }
      nuevoCodigo = `ST-${numero}`;
    });
    localStorage.setItem('doloya_codigo_pedido_actual', nuevoCodigo);
    if(pedidoId){
      try{ await updateDoc(doc(dbConf, "pedidos", pedidoId), { codigo: nuevoCodigo }); }catch(e){}
    }
    return nuevoCodigo;
  }catch(e){
    console.log("error contador", e);
    let contadorLocal = parseInt(localStorage.getItem('doloya_contador_local') || '0');
    let cod = `ST-${contadorLocal}`;
    localStorage.setItem('doloya_contador_local', (contadorLocal+1).toString());
    localStorage.setItem('doloya_codigo_pedido_actual', cod);
    return cod;
  }
}

if(pedidoFinal){
  // si ya tiene codigo en firestore, usar ese, si no generar nuevo
  if(pedidoFinal.codigo){
    document.getElementById('txtCodigo').textContent = pedidoFinal.codigo;
    localStorage.setItem('doloya_codigo_pedido_actual', pedidoFinal.codigo);
  }else{
    obtenerCodigoSecuencial().then(cod=>{
      document.getElementById('txtCodigo').textContent = cod;
    });
  }
  document.getElementById('txtNombre').textContent = pedidoFinal.cliente?.nombre || 'Cliente';
  // Metodo de pago - siempre efectivo
  let metodoTxt = 'Efectivo';
  if(pedidoFinal.metodoPago){
    if(typeof pedidoFinal.metodoPago === 'string') metodoTxt = pedidoFinal.metodoPago;
    else metodoTxt = pedidoFinal.metodoPago.nombre || pedidoFinal.metodoPago.banco || 'Efectivo';
  }
  document.getElementById('txtMetodo').textContent = metodoTxt;
  
  // Total con COP MXN
  const totalVal = pedidoFinal.totales?.total || 0;
  document.getElementById('txtTotal').textContent = `$ ${Number(totalVal).toLocaleString('es-CO')} COP MXN`;
}

let estadoActual='confirmado';
const estados=[
 {key:'confirmado',nombre:'Pedido Confirmado',desc:'Recibido', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13l4 4L19 7"/></svg>`},
 {key:'aceptado',nombre:'Pedido Aceptado',desc:'Restaurante aceptó', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>`},
 {key:'preparando',nombre:'Preparando',desc:'Cocinando tus alimentos', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M4 6v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6"/><path d="M8 6V4"/><path d="M12 6V4"/><path d="M16 6V4"/></svg>`},
 {key:'en_camino',nombre:'En Camino',desc:'Repartidor en camino', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M5 18V11h10l2-3h2v10"/><path d="M5 11l1.5-2"/></svg>`},
 {key:'finalizado',nombre:'Finalizado',desc:'Entregado', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 15l5 5L20 6"/><path d="M4 5l2 2"/><path d="M8 5l2 2"/></svg>`},
];

function render(){
 const cont=document.getElementById('timeline');
 const idx=estados.findIndex(e=>e.key===estadoActual);
 cont.innerHTML=estados.map((est,i)=>{
  const done=i<idx; const isCurrent=i===idx;
  return `<div class="step"><div class="line ${i<idx?'active':''}" style="${i===4?'display:none':''}"></div><div class="icon ${done?'active':''} ${isCurrent?'current':''}">${done?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`:est.icon}</div><div class="step-text"><b>${est.nombre}</b><span>${est.desc}</span></div></div>`;
 }).join('');
}
render();
if(pedidoId){ onSnapshot(doc(dbConf,"pedidos",pedidoId),(snap)=>{ if(snap.exists()&&snap.data().estado){ estadoActual=snap.data().estado; if(snap.data().codigo){ document.getElementById('txtCodigo').textContent = snap.data().codigo; localStorage.setItem('doloya_codigo_pedido_actual', snap.data().codigo); } render(); } }); }
function lanzar(){ const colors=['#16a34a','#ef4444','#f59e0b','#3b82f6','#eab308']; confetti({particleCount:120,spread:90,origin:{y:0.6},colors}); }
lanzar(); setTimeout(lanzar,1200);

window.llamarRestaurante = function(){
  const dataRest = JSON.parse(localStorage.getItem('doloya_carrito_restaurante_data')||'null');
  const tel = dataRest?.telefono || dataRest?.tel || dataRest?.celular || '';
  if(tel){
    window.location.href = `tel:${tel}`;
  }else{
    alert('Llamar al restaurante: no hay número registrado');
  }
}
</script>
</body>
</html>
