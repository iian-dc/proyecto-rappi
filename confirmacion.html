<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pedido Confirmado</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:Helvetica,Arial,sans-serif;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:20px 20px 40px}
.check-wrap{display:flex;justify-content:center;margin-top:24px}
.check-circle{width:72px;height:72px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
h1{text-align:center;font-size:28px;font-weight:800;margin:14px 0 22px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:18px 20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f5f5f5;align-items:center}.row:last-child{border:0}
.label{color:#666;font-size:14px}.value{font-weight:700;font-size:15px}.value.total{color:#16a34a;font-size:18px}
.value.verde{color:#16a34a;font-weight:800}
.timeline-title{margin:26px 0 12px;text-align:center;color:#666;font-size:13px;font-weight:600;letter-spacing:0.3px}
.step{display:flex;gap:12px;padding-bottom:22px;position:relative}.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #e5e7eb;background:#fff;z-index:1}
.icon.active{background:#16a34a;border-color:#16a34a;color:#fff}.icon.current{background:#f59e0b;border-color:#f59e0b;color:#fff;animation:pulse 1.8s infinite}
.icon.current.final{background:#16a34a;border-color:#16a34a;box-shadow:0 0 0 8px rgba(22,163,74,.25)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.line{position:absolute;left:20px;top:40px;bottom:-4px;width:2px;background:#e5e7eb}.line.active{background:#16a34a}
.step-text b{font-size:13.5px;font-weight:700;display:block}
.step-text span{font-size:11.5px;color:#666}
.botones-row{display:flex;gap:12px;margin-top:22px}
.btn-llamar{flex:1;background:#16a34a;color:#fff;border:none;border-radius:999px;padding:16px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px rgba(22,163,74,0.3)}
.btn-cancelar{flex:1;background:#E30613;color:#fff;border:none;border-radius:999px;padding:16px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px rgba(227,6,19,0.3);transition:all 0.3s ease}
.btn-cancelar.disabled{background:transparent;color:#aaa;border:1.5px solid #E5E7EB;box-shadow:none;pointer-events:none;opacity:0.6}
.btn-nuevo{width:100%;background:#111;color:#fff;border:none;border-radius:999px;padding:18px;font-size:15px;font-weight:900;display:none;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.2);margin-top:22px}
.btn-nuevo.mostrar{display:flex;animation:pop .4s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal-overlay.active{display:flex}
.modal-card{background:white;width:100%;max-width:320px;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:pop2 .2s ease;text-align:center}
@keyframes pop2{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.modal-card p{font-size:13px;color:#666;margin-bottom:18px;line-height:1.3}
.btns-confirm{display:flex;gap:10px}
.btn-si{flex:1;background:#E30613;color:#fff;border:none;border-radius:999px;padding:12px;font-weight:800;cursor:pointer}
.btn-no{flex:1;background:#F3F4F6;color:#111;border:1px solid #E5E7EB;border-radius:999px;padding:12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<div class="check-wrap"><div class="check-circle" id="checkCircle"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div></div>
<h1 id="tituloPrincipal">Pedido Confirmado</h1>
<div class="card">
<div class="row"><span class="label">Código del pedido</span><span class="value" id="txtCodigo">ST-0</span></div>
<div class="row"><span class="label">Nombre del cliente</span><span class="value" id="txtNombre">...</span></div>
<div class="row"><span class="label">Método de pago</span><span class="value verde" id="txtMetodo">Efectivo</span></div>
<div class="row"><span class="label">Total a pagar</span><span class="value total" id="txtTotal">$ 0 MXN</span></div>
</div>
<div class="timeline-title">Estado del pedido</div>
<div id="timeline"></div>
<div class="botones-row" id="botonesRow">
<button class="btn-cancelar" id="btnCancelar" onclick="abrirConfirmCancelar()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>Cancelar</button>
<button class="btn-llamar" id="btnLlamar" onclick="llamarRestaurante()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Llamar al restaurante</button>
</div>
<button class="btn-nuevo" id="btnNuevo" onclick="window.location.href='index.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Hacer pedido nuevo</button>
</div>

<div class="modal-overlay" id="modalCancelar">
  <div class="modal-card">
    <h3>¿Cancelar pedido?</h3>
    <p>¿Deseas eliminar este pedido? Esta acción no se puede deshacer.</p>
    <div class="btns-confirm">
      <button class="btn-no" onclick="cerrarConfirmCancelar()">No</button>
      <button class="btn-si" id="btnSiCancelar" onclick="confirmarCancelar()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, getDoc, setDoc, updateDoc, runTransaction, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const configConfirmacion = {
  apiKey: "AIzaSyDLKngPyi_SWAXEQwdrHO5h8L8OufulAR4",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
  storageBucket: "doloya-confirmacion.firebasestorage.app",
  messagingSenderId: "832228761099",
  appId: "1:832228761099:web:ddd4b6a0ee0d7f0494b10e"
};
const appConf = initializeApp(configConfirmacion, "confirmacion2");
const dbConf = getFirestore(appConf);
const pedidoFinal = JSON.parse(localStorage.getItem('doloya_pedido_final')||'null');
const pedidoId = localStorage.getItem('doloya_pedido_confirmacion_id');

window.dbConf = dbConf;
window.docRef = doc;
window.deleteDoc = deleteDoc;

async function obtenerCodigoSecuencial(){
  if(pedidoId){
    const mapaCodigos = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}');
    if(mapaCodigos[pedidoId]) return mapaCodigos[pedidoId];
  }
  if(pedidoFinal && pedidoFinal.codigo){
    if(pedidoId){
      const mapa = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}');
      mapa[pedidoId] = pedidoFinal.codigo;
      localStorage.setItem('doloya_mapa_codigos', JSON.stringify(mapa));
      localStorage.setItem('doloya_codigo_pedido_actual', pedidoFinal.codigo);
    }
    return pedidoFinal.codigo;
  }
  if(pedidoId){
    try{
      const snapPedido = await getDoc(doc(dbConf, "pedidos", pedidoId));
      if(snapPedido.exists() && snapPedido.data().codigo){
        const codExist = snapPedido.data().codigo;
        const mapa = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}');
        mapa[pedidoId] = codExist;
        localStorage.setItem('doloya_mapa_codigos', JSON.stringify(mapa));
        localStorage.setItem('doloya_codigo_pedido_actual', codExist);
        return codExist;
      }
    }catch(e){}
  }
  try{
    const contadorRef = doc(dbConf, "contadores", "pedidos");
    let nuevoCodigo = "";
    await runTransaction(dbConf, async (transaction)=>{
      const snap = await transaction.get(contadorRef);
      let numero = 0;
      if(!snap.exists()){
        numero = 0;
        transaction.set(contadorRef, { total: 1, ultimo: 0 });
      }else{
        numero = snap.data().total || 0;
        transaction.update(contadorRef, { total: numero + 1, ultimo: numero });
      }
      nuevoCodigo = `ST-${numero}`;
    });
    if(pedidoId){
      const mapa = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}');
      mapa[pedidoId] = nuevoCodigo;
      localStorage.setItem('doloya_mapa_codigos', JSON.stringify(mapa));
    }
    localStorage.setItem('doloya_codigo_pedido_actual', nuevoCodigo);
    if(pedidoId){
      try{ await updateDoc(doc(dbConf, "pedidos", pedidoId), { codigo: nuevoCodigo }); }catch(e){}
    }
    return nuevoCodigo;
  }catch(e){
    let contadorLocal = parseInt(localStorage.getItem('doloya_contador_local') || '0');
    let cod = `ST-${contadorLocal}`;
    if(pedidoId){
      const mapa = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}');
      if(!mapa[pedidoId]){
        localStorage.setItem('doloya_contador_local', (contadorLocal+1).toString());
      }else{
        cod = mapa[pedidoId];
      }
      mapa[pedidoId] = cod;
      localStorage.setItem('doloya_mapa_codigos', JSON.stringify(mapa));
    }
    localStorage.setItem('doloya_codigo_pedido_actual', cod);
    return cod;
  }
}

if(pedidoFinal){
  obtenerCodigoSecuencial().then(cod=>{
    document.getElementById('txtCodigo').textContent = cod;
  });
  document.getElementById('txtNombre').textContent = pedidoFinal.cliente?.nombre || pedidoFinal.nombre || 'Cliente';
  let metodoTxt = 'Efectivo';
  if(pedidoFinal.metodoPago){
    if(typeof pedidoFinal.metodoPago === 'string') metodoTxt = pedidoFinal.metodoPago;
    else metodoTxt = pedidoFinal.metodoPago.nombre || pedidoFinal.metodoPago.banco || 'Efectivo';
  }
  document.getElementById('txtMetodo').textContent = metodoTxt;
  const totalVal = pedidoFinal.totales?.total || 0;
  document.getElementById('txtTotal').textContent = `$ ${Number(totalVal).toLocaleString('es-CO')} MXN`;
}

let estadoActual='confirmado';
let subEstadoRepartidor='';
const estados=[
 {key:'confirmado',nombre:'Pedido Confirmado',desc:'Recibido', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13l4 4L19 7"/></svg>`},
 {key:'aceptado',nombre:'Pedido Aceptado',desc:'Restaurante aceptó tu pedido', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>`},
 {key:'preparando',nombre:'Preparando',desc:'Cocinando tus alimentos', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M4 6v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6"/><path d="M8 6V4"/><path d="M12 6V4"/><path d="M16 6V4"/></svg>`},
 {key:'en_camino',nombre:'En Camino',desc:'Repartidor en camino', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M5 18V11h10l2-3h2v10"/><path d="M5 11l1.5-2"/></svg>`},
 {key:'finalizado',nombre:'Finalizado',desc:'Entregado', icon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 15l5 5L20 6"/><path d="M4 5l2 2"/><path d="M8 5l2 2"/></svg>`},
];

function mapearEstadoRestauranteACliente(estadoRestaurante){
  if(!estadoRestaurante) return 'confirmado';
  const e = estadoRestaurante.toLowerCase();
  const mapa = {
    'nuevo': 'confirmado',
    'confirmado': 'confirmado',
    'aceptado': 'aceptado',
    'en_preparacion': 'preparando',
    'preparando': 'preparando',
    'listo': 'preparando',
    'listo_para_admin': 'preparando',
    'enviado_a_repartidor': 'aceptado',
    'activo': 'aceptado',
    'ir_a_recoger': 'preparando',
    'recogido': 'en_camino',
    'ir_a_entregar': 'en_camino',
    'en_camino': 'en_camino',
    'finalizado': 'finalizado',
    'entregado': 'finalizado',
    'cancelado': 'confirmado'
  };
  return mapa[e] || 'confirmado';
}

function descripcionRepartidor(estadoReal){
  if(!estadoReal) return null;
  const e = estadoReal.toLowerCase();
  if(e==='ir_a_recoger') return {titulo:'Preparando', desc:'Repartidor va al restaurante'};
  if(e==='recogido') return {titulo:'En Camino', desc:'Repartidor tiene tu pedido - En camino a tu casa'};
  if(e==='ir_a_entregar' || e==='en_camino') return {titulo:'En Camino', desc:'Repartidor en camino a tu casa'};
  if(e==='finalizado' || e==='entregado') return {titulo:'Finalizado', desc:'Pedido entregado'};
  return null;
}

function actualizarBotones(){
  const btnCancel = document.getElementById('btnCancelar');
  if(estadoActual === 'confirmado' || estadoActual === 'aceptado'){
    btnCancel.classList.remove('disabled');
  }else{
    btnCancel.classList.add('disabled');
  }
}

function lanzarConfetiEsquinas(){
  const colors=['#16a34a','#22c55e','#4ade80','#f59e0b','#eab308'];
  // Izquierda
  confetti({particleCount:120, angle:60, spread:75, origin:{x:0, y:0.9}, colors, scalar:1.2, startVelocity:55, gravity:0.8, ticks:300});
  // Derecha
  confetti({particleCount:120, angle:120, spread:75, origin:{x:1, y:0.9}, colors, scalar:1.2, startVelocity:55, gravity:0.8, ticks:300});
}

function celebrarFinalizado(){
  document.getElementById('tituloPrincipal').textContent = 'Pedido Entregado';
  document.getElementById('checkCircle').style.background = '#16a34a';
  const botonesRow = document.getElementById('botonesRow');
  if(botonesRow) botonesRow.style.display = 'none';
  const btnNuevo = document.getElementById('btnNuevo');
  if(btnNuevo) btnNuevo.classList.add('mostrar');

  // Confeti elegante desde esquinas hacia arriba
  lanzarConfetiEsquinas();
  setTimeout(lanzarConfetiEsquinas,300);
  setTimeout(lanzarConfetiEsquinas,650);
  setTimeout(lanzarConfetiEsquinas,1000);
  setTimeout(lanzarConfetiEsquinas,1400);
  setTimeout(()=>{
    confetti({particleCount:80, angle:60, spread:80, origin:{x:0, y:0.8}, colors:['#16a34a','#22c55e'], scalar:1.1, startVelocity:60});
    confetti({particleCount:80, angle:120, spread:80, origin:{x:1, y:0.8}, colors:['#16a34a','#22c55e'], scalar:1.1, startVelocity:60});
  },1800);
}

function render(){
 const cont=document.getElementById('timeline');
 const idx=estados.findIndex(e=>e.key===estadoActual);
 cont.innerHTML=estados.map((est,i)=>{
  const done=i<idx; const isCurrent=i===idx;
  let desc = est.desc;
  if(isCurrent && subEstadoRepartidor){
    const d = descripcionRepartidor(subEstadoRepartidor);
    if(d) desc = d.desc;
  }
  const esFinal = estadoActual==='finalizado' && isCurrent;
  return `<div class="step"><div class="line ${i<idx || estadoActual==='finalizado' && i<4 ?'active':''}" style="${i===4?'display:none':''}"></div><div class="icon ${done || estadoActual==='finalizado' ?'active':''} ${isCurrent?'current':''} ${esFinal?'final':''}">${done || esFinal?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`:est.icon}</div><div class="step-text"><b>${est.nombre}</b><span>${desc}</span></div></div>`;
 }).join('');
 actualizarBotones();
 if(estadoActual==='finalizado'){
   celebrarFinalizado();
 }
}
render();

if(pedidoId){ 
  onSnapshot(doc(dbConf,"pedidos",pedidoId),(snap)=>{ 
    if(snap.exists()){
      const data = snap.data();
      if(data.estado){
        subEstadoRepartidor = data.estado;
        estadoActual = mapearEstadoRestauranteACliente(data.estado);
        render(); 
      }
      if(data.codigo){ 
        document.getElementById('txtCodigo').textContent = data.codigo; 
        localStorage.setItem('doloya_codigo_pedido_actual', data.codigo); 
        if(pedidoId){ 
          const mapa = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}'); 
          mapa[pedidoId]=data.codigo; 
          localStorage.setItem('doloya_mapa_codigos', JSON.stringify(mapa)); 
        } 
      }
      if(data.nombre){
        document.getElementById('txtNombre').textContent = data.nombre;
      }
    } 
  }); 
  onSnapshot(doc(dbConf,"pedidos_admin",pedidoId),(snap)=>{
    if(snap.exists()){
      const data = snap.data();
      if(data.estado){
        subEstadoRepartidor = data.estado;
        estadoActual = mapearEstadoRestauranteACliente(data.estado);
        render();
      }
    }
  });
}

function lanzar(){ 
  const colors=['#16a34a','#ef4444','#f59e0b','#3b82f6','#eab308']; 
  confetti({particleCount:80, angle:60, spread:70, origin:{x:0, y:0.9}, colors, scalar:1.1, startVelocity:45});
  confetti({particleCount:80, angle:120, spread:70, origin:{x:1, y:0.9}, colors, scalar:1.1, startVelocity:45});
}
lanzar(); setTimeout(lanzar,400); setTimeout(lanzar,800);

window.abrirConfirmCancelar = function(){
  if(document.getElementById('btnCancelar').classList.contains('disabled')) return;
  document.getElementById('modalCancelar').classList.add('active');
}
window.cerrarConfirmCancelar = function(){
  document.getElementById('modalCancelar').classList.remove('active');
}
window.confirmarCancelar = async function(){
  const btn = document.getElementById('btnSiCancelar');
  btn.textContent = 'Eliminando...';
  btn.disabled = true;
  try{
    if(pedidoId){
      await deleteDoc(doc(dbConf, "pedidos", pedidoId));
      try{ await deleteDoc(doc(dbConf, "pedidos_admin", pedidoId)); }catch{}
    }
    localStorage.removeItem('doloya_pedido_final');
    localStorage.removeItem('doloya_pedido_confirmacion_id');
    localStorage.removeItem('doloya_codigo_pedido_actual');
    if(pedidoId){
      const mapa = JSON.parse(localStorage.getItem('doloya_mapa_codigos')||'{}');
      delete mapa[pedidoId];
      localStorage.setItem('doloya_mapa_codigos', JSON.stringify(mapa));
    }
    window.location.href='inicio.html';
  }catch(e){
    alert('Error: '+e.message);
    btn.textContent = 'Sí, eliminar';
    btn.disabled = false;
  }
}

window.llamarRestaurante = function(){
  const dataRest = JSON.parse(localStorage.getItem('doloya_carrito_restaurante_data')||'null');
  const tel = dataRest?.telefono || dataRest?.tel || dataRest?.celular || '';
  if(tel){
    window.location.href = `tel:${tel}`;
  }else{
    alert('Llamar al restaurante: no hay número registrado');
  }
}
</script>
</body>
</html>
