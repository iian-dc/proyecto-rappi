<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Confirmado - Doloya</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:20px 20px 40px;position:relative;z-index:2}
.check-wrap{display:flex;justify-content:center;margin-top:30px}
.check-circle{width:96px;height:96px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(22,163,74,0.3);animation:pop .6s ease}
.check-circle::after{content:'✓';color:white;font-size:56px;font-weight:700;line-height:1}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
h1{text-align:center;font-size:28px;font-weight:800;margin:18px 0 22px;color:#111}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:18px 20px;box-shadow:0 4px 18px rgba(0,0,0,0.06)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f5f5f5}
.row:last-child{border:0}
.label{color:#666;font-size:14px}
.value{font-weight:700;color:#111;font-size:15px}
.value.total{color:#16a34a;font-size:18px}
.timeline-title{margin:26px 0 16px;text-align:center;color:#666;font-size:15px;font-weight:600;letter-spacing:.3px}
.timeline{position:relative;padding-left:8px}
.step{position:relative;display:flex;gap:14px;padding-bottom:28px}
.step:last-child{padding-bottom:0}
.line{position:absolute;left:23px;top:46px;bottom:-6px;width:2px;background:#e5e7eb}
.line.active{background:#16a34a}
.icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;border:2px solid #e5e7eb;background:#fff;color:#9ca3af;z-index:1}
.icon.active{background:#16a34a;border-color:#16a34a;color:white;box-shadow:0 4px 12px rgba(22,163,74,.3)}
.icon.current{background:#f59e0b;border-color:#f59e0b;color:white;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.step-content{flex:1;padding-top:2px}
.step-name{font-weight:700;font-size:16px;color:#111}
.step-name.done{color:#111}
.step-name.pending{color:#9ca3af}
.step-desc{font-size:13px;color:#666;margin-top:3px}
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="confettiCanvas" class="confetti-layer"></canvas>
<div class="container">
  <div class="check-wrap"><div class="check-circle"></div></div>
  <h1>Pedido Confirmado</h1>
  
  <div class="card" id="infoCard">
    <div class="row"><span class="label">Código del pedido</span><span class="value" id="txtCodigo">PED-...</span></div>
    <div class="row"><span class="label">Nombre del cliente</span><span class="value" id="txtNombre">...</span></div>
    <div class="row"><span class="label">Total a pagar</span><span class="value total" id="txtTotal">$ 0 COP</span></div>
  </div>

  <div class="timeline-title">Estado del pedido</div>
  <div class="timeline" id="timeline">
    <!-- Steps se pintan con JS -->
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// CONFIG CONFIRMACION
const firebaseConfigConf = {
  apiKey: "AIzaSyBq8s3WJ5i7R7vF8zQ9xK0L1M2N3O4P5Q6",
  authDomain: "doloya-confirmacion.firebaseapp.com",
  projectId: "doloya-confirmacion",
};
const firebaseConfigAliados = {
  apiKey: "AIzaSyDUMMY_ALIADOS_KEY",
  authDomain: "doloya-aliados.firebaseapp.com",
  projectId: "doloya-aliados",
};

// Intenta usar las configs que ya tenias en localStorage si existen, si no usa default
let appConf, dbConf;
try{
  const conf1 = JSON.parse(localStorage.getItem('firebase_conf_confirmacion')||'null');
  if(conf1) { appConf = initializeApp(conf1, "confirmacion"); }
  else { appConf = initializeApp({projectId:"doloya-confirmacion", apiKey:"AIzaSy...pon-tu-key-aqui", authDomain:"doloya-confirmacion.firebaseapp.com"}, "confirmacion"); }
  dbConf = getFirestore(appConf);
}catch(e){ console.log("conf init fail", e); }

const pedidoFinal = JSON.parse(localStorage.getItem('doloya_pedido_final') || 'null');
const pedidoId = localStorage.getItem('doloya_pedido_confirmacion_id');
const pedidoIdAliados = localStorage.getItem('doloya_pedido_id');

if(pedidoFinal){
  document.getElementById('txtCodigo').textContent = pedidoId ? pedidoId.substring(0,8).toUpperCase() : 'PED-'+Date.now().toString().slice(-6);
  document.getElementById('txtNombre').textContent = pedidoFinal.cliente?.nombre || localStorage.getItem('doloya_cliente_nombre') || 'Cliente';
  document.getElementById('txtTotal').textContent = '$ ' + (pedidoFinal.totales?.total || 0).toLocaleString('es-CO') + ' COP';
}

// LOGICA PARA BORRAR DE ALIADOS Y GUARDAR EN CONFIRMACION (por si no se hizo en resumen)
async function asegurarFlujo(){
  try{
    // Si no hay ID de confirmacion, guardarlo
    if(!pedidoId && pedidoFinal && dbConf){
      const ref = await addDoc(collection(dbConf, "pedidos"), pedidoFinal);
      localStorage.setItem('doloya_pedido_confirmacion_id', ref.id);
      document.getElementById('txtCodigo').textContent = ref.id.substring(0,8).toUpperCase();
      // borrar aliados
      if(pedidoIdAliados){
        try{
          const appAl = initializeApp({projectId:"doloya-aliados"}, "aliados-del");
          const dbAl = getFirestore(appAl);
          await deleteDoc(doc(dbAl, "carrito", pedidoIdAliados));
          localStorage.removeItem('doloya_pedido_id');
        }catch(e){}
      }
    }
  }catch(e){ console.log("asegurar flujo error", e); }
}
asegurarFlujo();

// TIMELINE
const estados = [
  {key:'confirmado', nombre:'Pedido Confirmado', desc:'Tu pedido fue recibido'},
  {key:'aceptado', nombre:'Pedido Aceptado', desc:'El restaurante aceptó tu pedido'},
  {key:'preparando', nombre:'Preparando', desc:'Estamos preparando tus alimentos'},
  {key:'en_camino', nombre:'En Camino', desc:'Tu repartidor va en camino'},
  {key:'finalizado', nombre:'Finalizado', desc:'Pedido entregado'},
];
let estadoActual = 'confirmado';

function renderTimeline(){
  const cont = document.getElementById('timeline');
  const idxActual = estados.findIndex(e=>e.key===estadoActual);
  cont.innerHTML = estados.map((est,i)=>{
    const done = i < idxActual;
    const isCurrent = i === idxActual;
    const isPending = i > idxActual;
    const iconClass = done || isCurrent && i!==0 ? 'active' : isCurrent ? 'current' : '';
    const lineClass = done ? 'active' : '';
    const nameClass = isPending ? 'pending' : 'done';
    const icons = ['✓','📋','🍳','🛵','🏁'];
    return `<div class="step">
      ${i < estados.length-1 ? `<div class="line ${i < idxActual ? 'active':''}"></div>`:''}
      <div class="icon ${isCurrent ? 'current' : done ? 'active' : ''}">${done ? '✓' : icons[i]}</div>
      <div class="step-content"><div class="step-name ${nameClass}">${est.nombre}</div><div class="step-desc">${i<=idxActual ? est.desc + ' • ' + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : 'Pendiente'}</div></div>
    </div>`;
  }).join('');
}
renderTimeline();

// ESCUCHA TIEMPO REAL DESDE CONFIRMACION
try{
  if(pedidoId && dbConf){
    onSnapshot(doc(dbConf, "pedidos", pedidoId), (snap)=>{
      if(snap.exists()){
        const data = snap.data();
        if(data.estado) { estadoActual = data.estado; renderTimeline(); }
      }
    });
  }
}catch(e){}

// CONFETIS CON ROJO
function lanzarConfeti(){
  const colors = ['#16a34a','#ef4444','#f59e0b','#3b82f6','#eab308','#a855f7','#ec4899','#22c55e'];
  confetti({ particleCount: 120, spread: 90, origin:{y:0.6}, colors: colors, zIndex: 20 });
  setTimeout(()=>confetti({ particleCount: 80, angle:60, spread:70, origin:{x:0,y:0.7}, colors:colors}),300);
  setTimeout(()=>confetti({ particleCount: 80, angle:120, spread:70, origin:{x:1,y:0.7}, colors:colors}),500);
}
lanzarConfeti();
setTimeout(lanzarConfeti, 1200);
</script>
</body>
</html>
