<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DoloYa - Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#fff;color:#111;min-height:100vh}
.header{padding:14px 16px 10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.header-left{display:flex;align-items:center;gap:10px}
.logo-d{width:48px;height:48px;background:#D5000F;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:28px;font-style:italic;transform:skew(-6deg)}
.ubi-label{font-size:11px;color:#666;font-weight:500}
.ubi-city{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;color:#111;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap{padding:0 16px 14px 16px;position:relative}
.search{width:100%;height:46px;background:#F3F4F6;border-radius:999px;border:1.5px solid #E5E7EB;display:flex;align-items:center;padding:0 14px;gap:10px}
.search input{flex:1;border:none;background:transparent;outline:none;font-size:14px;font-weight:500}
.search-result{position:absolute;top:52px;left:16px;right:16px;background:white;border:1px solid #EEE;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,0.1);z-index:20;max-height:220px;overflow-y:auto;display:none}
.search-item{padding:10px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid #F5F5F5}
.search-item:last-child{border:none}
.search-item img{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#111}
.search-item b{font-size:13px}
.banners{padding:0 16px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{scroll-snap-align:start;min-width:92%;height:150px;border-radius:18px;background:linear-gradient(100deg,#D5000F 0%,#A8000C 100%);position:relative;overflow:hidden;display:flex;flex-shrink:0}
.banner-text{padding:16px;width:58%;z-index:2}
.banner-text h2{color:white;font-size:22px;font-weight:800;line-height:1.1}
.banner-text p{color:rgba(255,255,255,0.9);font-size:12px;margin-top:4px;line-height:1.3}
.banner-text .btn-mini{margin-top:10px;background:#FFE24C;color:#111;padding:7px 14px;border-radius:999px;font-weight:800;font-size:12px;display:inline-block}
.banner-img{position:absolute;right:-10px;bottom:-10px;width:55%;height:100%;object-fit:cover}
.categories{padding:12px 0 12px 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.categories::-webkit-scrollbar{display:none}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:62px;flex-shrink:0}
.cat-icon{width:56px;height:56px;background:linear-gradient(180deg,#FFFFFF 0%,#F5F5F7 100%);border-radius:16px;display:flex;align-items:center;justify-content:center;border:1px solid #EEE;box-shadow:0 2px 8px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9);transition:all 0.2s;position:relative;overflow:hidden}
.cat-icon::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.8) 0%,transparent 100%);border-radius:16px 16px 0 0}
.cat-item.active .cat-icon{border-color:#D5000F;background:linear-gradient(180deg,#FFF1F2 0%,#FFE4E6 100%);box-shadow:0 4px 12px rgba(213,0,15,0.15)}
.cat-item span{font-size:11px;font-weight:600;color:#222}
.icon-3d{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.1));z-index:1;font-size:26px;display:flex;align-items:center;justify-content:center}
.section-title{padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
.section-title h3{font-size:16px;font-weight:800}
.section-title a{font-size:13px;color:#D5000F;font-weight:700;text-decoration:none}
.restaurants{padding:0 16px 20px 16px;display:flex;flex-direction:column;gap:12px}
.rest-card{display:flex;gap:12px;padding:12px;border:1.5px solid #F0F0F0;border-radius:16px;background:white}
.rest-logo{width:70px;height:70px;border-radius:12px;background:#111;object-fit:cover;flex-shrink:0}
.rest-info{flex:1}
.rest-top{display:flex;justify-content:space-between;align-items:flex-start}
.rest-name{font-size:13px;font-weight:800;line-height:1.2;max-width:170px}
.badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:4px}
.badge-open{background:#E6F9ED;color:#0A7D2E;border:1px solid #B5ECC5}
.dot{width:6px;height:6px;background:#16A34A;border-radius:50%}
.rating{margin-top:4px;display:flex;gap:4px;align-items:center;font-size:11px;font-weight:600}
.tags{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 8px;background:#F3F4F6;border-radius:999px;color:#555;font-weight:600}
.rest-bottom{margin-top:5px;display:flex;gap:6px;font-size:11px;color:#555;font-weight:600;align-items:center}
.no-ubi{height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.no-ubi h2{font-size:20px;font-weight:800;margin-top:14px}
.no-ubi p{font-size:14px;color:#666;margin-top:8px;max-width:280px;line-height:1.4}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-d">D</div>
    <div>
      <div class="ubi-label">Tu ubicación</div>
      <div class="ubi-city"><span style="color:#D5000F">📍</span><span id="txtUbi">Obteniendo ubicación...</span></div>
    </div>
  </div>
</div>

<div id="contenidoDolores">
<div class="search-wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="buscador" type="text" placeholder="Busca restaurantes o comercios..." autocomplete="off">
  </div>
  <div id="searchResult" class="search-result"></div>
</div>

<div class="banners">
  <div class="banner">
    <div class="banner-text"><h2>Tu antojo,<br>en minutos</h2><p>Restaurantes, comida<br>y mucho más.</p><div class="btn-mini">Pide ahora</div></div>
    <img class="banner-img" src="https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?auto=format&fit=crop&w=400&q=80">
  </div>
  <div class="banner" style="background:linear-gradient(100deg,#111 0%,#333 100%)">
    <div class="banner-text"><h2>Promo del<br>día 🔥</h2><p>Envío gratis en<br>pedidos + $150</p><div class="btn-mini">Ver promos</div></div>
    <img class="banner-img" src="https://images.unsplash.com/photo-1593246049226-ded77bf38872?auto=format&fit=crop&w=400&q=80">
  </div>
</div>

<div class="categories" id="categorias">
  <div class="cat-item active" data-cat="todos"><div class="cat-icon"><div class="icon-3d">✨</div></div><span>Todos</span></div>
  <div class="cat-item" data-cat="burgers"><div class="cat-icon"><div class="icon-3d">🍔</div></div><span>Burger</span></div>
  <div class="cat-item" data-cat="tacos"><div class="cat-icon"><div class="icon-3d">🌮</div></div><span>Tacos</span></div>
  <div class="cat-item" data-cat="hotdog"><div class="cat-icon"><div class="icon-3d">🌭</div></div><span>Hot Dog</span></div>
  <div class="cat-item" data-cat="alitas"><div class="cat-icon"><div class="icon-3d">🍗</div></div><span>Alitas</span></div>
  <div class="cat-item" data-cat="pizzas"><div class="cat-icon"><div class="icon-3d">🍕</div></div><span>Pizzas</span></div>
</div>

<div class="section-title"><h3>Restaurantes cerca de ti</h3><a href="#" id="verTodos">Ver todos ›</a></div>
<div class="restaurants" id="listaRestaurantes"></div>
</div>

<div id="noDolores" style="display:none" class="no-ubi">
  <div style="width:70px;height:70px;background:#FFF1F2;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px">📍</div>
  <h2>Sin cobertura para tu ubicación</h2>
  <p id="msgNoUbi"></p>
  <p style="margin-top:10px;font-size:11px;color:#999" id="debugUbi"></p>
</div>

<script type="module">
import { initializeApp as initApp1 } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase as getDB1 } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { initializeApp as initApp2 } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase as getDB2, ref as ref2, onValue as onValue2 } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const configUbi = {
  apiKey: "AIzaSyCNL6ebow0VEJ4VfhI2ItVi4gFAjkOiMuo",
  authDomain: "doloya-ubicaciones.firebaseapp.com",
  databaseURL: "https://doloya-ubicaciones-default-rtdb.firebaseio.com",
  projectId: "doloya-ubicaciones",
  appId: "1:864757091561:web:7d4f696b95fdc700dab478"
};
const configAliados = {
  apiKey: "AIzaSyD286qlJQT8D3rqbYTSfCyuTAEg9jjRchQ",
  authDomain: "doloya-aliados.firebaseapp.com",
  databaseURL: "https://doloya-aliados-default-rtdb.firebaseio.com",
  projectId: "doloya-aliados",
  appId: "1:122314467740:web:9947a0a9560557e3a00059"
};
initApp1(configUbi, "ubi");
const appAli = initApp2(configAliados, "aliados");
const dbAli = getDB2(appAli);

const dataStr = localStorage.getItem('doloya_ubicacion');
if(!dataStr){ window.location.href = "index.html"; }
const cliente = JSON.parse(dataStr);
const lat = cliente.ubicacion?.lat;
const lng = cliente.ubicacion?.lng;

async function obtenerDireccionReal(){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
    const data = await res.json();
    const addr = data.address;
    
    const calle = addr.road || addr.street || addr.footway || "";
    const numero = addr.house_number || "";
    const colonia = addr.suburb || addr.neighbourhood || addr.residential || "";
    const municipio = addr.city || addr.town || addr.village || addr.municipality || addr.county || "";
    const estado = addr.state || "";
    
    // CONSTRUIR DIRECCION COMPLETA REAL
    let partes = [];
    if(calle) partes.push(`${calle} ${numero}`.trim());
    if(colonia) partes.push(colonia);
    if(municipio) partes.push(municipio);
    if(estado) partes.push(estado);
    
    const direccionCompleta = partes.join(', ');
    
    // MOSTRAR DIRECCION COMPLETA ARRIBA - CORREGIDO
    document.getElementById('txtUbi').textContent = direccionCompleta || data.display_name;
    document.getElementById('debugUbi').textContent = data.display_name;

    cliente.direccionReal = data.display_name;
    cliente.calle = calle;
    cliente.municipio = municipio;
    cliente.estado = estado;
    cliente.direccionCompleta = direccionCompleta;
    localStorage.setItem('doloya_ubicacion', JSON.stringify(cliente));

    const esDolores = (municipio && municipio.toLowerCase().includes('dolores')) || data.display_name.toLowerCase().includes('dolores hidalgo');

    if(!esDolores){
      document.getElementById('contenidoDolores').style.display='none';
      document.getElementById('noDolores').style.display='flex';
      document.getElementById('msgNoUbi').innerHTML = `Estás en <b>${direccionCompleta}</b><br><br>Sin cobertura para tu ubicación`;
    }
  }catch(e){
    console.error(e);
    const dentroRango = lat>=20.90 && lat<=21.45 && lng>=-101.25 && lng<=-100.55;
    document.getElementById('txtUbi').textContent = dentroRango ? "Dolores Hidalgo, Guanajuato" : `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    document.getElementById('debugUbi').textContent = `Lat: ${lat}, Lng: ${lng} - Error reverse`;
    if(!dentroRango){
      document.getElementById('contenidoDolores').style.display='none';
      document.getElementById('noDolores').style.display='flex';
      document.getElementById('msgNoUbi').textContent = `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)} - Sin cobertura para tu ubicación`;
    }
  }
}
obtenerDireccionReal();

let aliadosData = [];
const listaEl = document.getElementById('listaRestaurantes');
const searchResult = document.getElementById('searchResult');

function renderAliados(filtroCat="todos", busqueda=""){
  let f = aliadosData;
  if(filtroCat!=="todos") f=f.filter(a=>(a.categoria||"").toLowerCase().includes(filtroCat));
  if(busqueda) f=f.filter(a=>a.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  listaEl.innerHTML="";
  if(f.length===0){ listaEl.innerHTML=`<p style="text-align:center;color:#999;padding:20px;font-size:13px">No se encontraron</p>`; return;}
  f.forEach(a=>{
    listaEl.innerHTML+=`
    <div class="rest-card" onclick="ir('${a.id}')">
      <img class="rest-logo" src="${a.logo||'https://via.placeholder.com/70'}">
      <div class="rest-info">
        <div class="rest-top"><div class="rest-name">${a.nombre}</div><div class="badge badge-open"><div class="dot"></div>Abierto</div></div>
        <div class="rating">⭐ ${a.rating||'4.8'} <span style="color:#777">(${a.reseñas||'1.2k'})</span></div>
        <div class="tags"><div class="tag">${a.categoria||'Comida'}</div></div>
        <div class="rest-bottom">🛵 ${a.tiempoEntrega||'20 min'} · $${a.costoEnvio||'35'}</div>
      </div>
    </div>`;
  });
}

function renderSearchDropdown(text){
  if(!text){ searchResult.style.display='none'; return; }
  const fil = aliadosData.filter(a=>a.nombre.toLowerCase().includes(text.toLowerCase())).slice(0,6);
  if(fil.length===0){ searchResult.style.display='none'; return; }
  searchResult.innerHTML="";
  fil.forEach(a=>{
    searchResult.innerHTML+=`<div class="search-item" onclick="ir('${a.id}')"><img src="${a.logo||''}"><div><b>${a.nombre}</b><div style="font-size:11px;color:#777">${a.categoria||''}</div></div></div>`;
  });
  searchResult.style.display='block';
}

window.ir=(id)=>{ localStorage.setItem('doloya_aliadoSeleccionado',id); location.href=`aliado.html?id=${id}`; }

onValue2(ref2(dbAli,'doloya_aliados'), snap=>{
  const v=snap.val();
  if(v){ aliadosData=Object.values(v).filter(a=>a.activo!==false); }
  else{
    aliadosData=[
      {id:'1',nombre:'La Catrina Burger & Grill',categoria:'burgers',logo:'',rating:'4.8',reseñas:'1.2k',tiempoEntrega:'15 min',costoEnvio:'35'},
      {id:'2',nombre:'Tacos El Chingón',categoria:'tacos',logo:'',rating:'4.7',reseñas:'856',tiempoEntrega:'20 min',costoEnvio:'35'},
      {id:'3',nombre:'Dogos & Más',categoria:'hotdog',logo:'',rating:'4.6',reseñas:'642',tiempoEntrega:'25 min',costoEnvio:'35'},
      {id:'4',nombre:'Alitas Factory',categoria:'alitas',logo:'',rating:'4.9',reseñas:'1.3k',tiempoEntrega:'30 min',costoEnvio:'45'},
    ];
  }
  renderAliados();
});

const buscador=document.getElementById('buscador');
buscador.addEventListener('input',e=>{
  const cat=document.querySelector('.cat-item.active')?.dataset.cat||'todos';
  renderAliados(cat,e.target.value);
  renderSearchDropdown(e.target.value);
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrap')) searchResult.style.display='none'; });
document.querySelectorAll('.cat-item').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    renderAliados(el.dataset.cat, buscador.value);
  });
});
document.getElementById('verTodos').addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('active'));document.querySelector('[data-cat="todos"]').classList.add('active');renderAliados('todos','');buscador.value='';});
</script>
</body>
</html>
